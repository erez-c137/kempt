<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kempt - 22 px monochrome panel glyph. Hand-hinted on the 22 px pixel grid,
  every edge on an integer coordinate. Never scale this drawing down to 16 px;
  use kempt-symbolic-16.svg, which is a separate hand-hinted drawing.

  Glyph  16 w x 13 h   (x 2-18, y 3-16)
  Spine  y 3-8   (5 px)          spine : teeth = 5 : 8, near the 36/64 target
  Teeth  y 8-16  (8 px), 2 px wide, 1 px gaps, square tips
         x: 3-5, 6-8, 9-11, 12-14, 15-17   (1 px spine overhang each end)

  Badge clearance. The plasmoid draws an opaque count badge anchored to the
  bottom-right of the panel cell at 0.5 x the short side, over an icon drawn at
  0.7 x the short side and centred - which lands on exactly x>=11, y>=11 in this
  viewBox. The glyph is therefore shifted 1 px up and 1 px left of centre, so the
  spine and the first three teeth sit entirely clear of the badge and the comb
  still reads with the badge shown. The teeth are deliberately left EQUAL: a
  shortened last tooth clears nothing extra once the badge is opaque, and reads
  as a broken comb in the badge-hidden state, which is the common one.

  Not the Breeze ruler (actions/22/measure): that is a hollow outlined box with
  short ticks inside it. This is a solid spine with long teeth outside it.

  SHIPPED BUT UNREFERENCED, deliberately. No code loads this file: the plasmoid's
  panel icon comes from metadata.json's "Icon": "kempt", which resolves through the
  icon THEME (install.sh copies contents/icons/kempt.svg into hicolor), and nothing
  names kempt-symbolic. It is here for the planned panel-icon-choice setting, which
  will let the user pick the monochrome comb instead of the themed update icon. Do
  not "clean up" as dead weight; do not assume a change here reaches the panel.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="22" height="22" viewBox="0 0 22 22">
    <defs id="defs3">
    <style type="text/css" id="current-color-scheme">
        .ColorScheme-Text {            color:#232629;        }
    </style>
    </defs>
    <path
       class="ColorScheme-Text"
       fill="currentColor"
       d="M2 3 H18 V8 H17 V16 H15 V8 H14 V16 H12 V8 H11 V16 H9 V8 H8 V16 H6 V8 H5 V16 H3 V8 H2 Z" />
</svg>
