<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kempt - 16 px monochrome panel glyph. A separate hand-hinted drawing, not a
  scaled copy of the 22 px one: every edge lands on an integer 16 px coordinate.

  Glyph  14 w x 10 h, centred (x 1-15, y 3-13)
  Spine  y 3-6  (3 px)
  Teeth  y 6-13 (7 px), 2 px wide, 1 px gaps, square tips, flush with the spine ends
         x: 1-3, 4-6, 7-9, 10-12, 13-15
  5 teeth at 2 px / 1 px = 14 px exactly, so the pitch never lands off-grid.

  SHIPPED BUT UNREFERENCED, deliberately - same as kempt-symbolic.svg: no code loads
  either file. Both are here for the planned panel-icon-choice setting; the panel icon
  today comes from metadata.json's "Icon": "kempt" via the icon theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="16" height="16" viewBox="0 0 16 16">
    <defs id="defs3">
    <style type="text/css" id="current-color-scheme">
        .ColorScheme-Text {            color:#232629;        }
    </style>
    </defs>
    <path
       class="ColorScheme-Text"
       fill="currentColor"
       d="M1 3 H15 V13 H13 V6 H12 V13 H10 V6 H9 V13 H7 V6 H6 V13 H4 V6 H3 V13 H1 Z" />
</svg>
