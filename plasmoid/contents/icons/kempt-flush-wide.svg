<!--
  Kempt - full-colour application icon, FLUSH + FULL-WIDTH variant (decision candidate).
  Answers the obvious objection to kempt-flush.svg: "flush is right, but now the comb
  is smaller." This one keeps the shipped comb's exact 184 x 140 footprint and moves
  the outermost teeth out to the spine ends, stretching the tooth pitch to fill it.

  Comb   184 x 140 = 71.9% x 54.7% of the 256 tile, centred (x 36-220, y 58-198) -
         identical bounding box to kempt.svg.
         Spine  50 px = 36%   y 58-108, width 184 (= tooth span), top corners r=8.
         Teeth  90 px = 64%   y 108-198, square tips.
         5 teeth, 20 px wide, 21 px gaps (tooth ~ gap), zero overhang.
         Tooth spans x: 36-56, 77-97, 118-138, 159-179, 200-220.

  Cost, stated plainly: kempt.svg's 16 px teeth on 16 px gaps land on exact pixel
  boundaries at 128, 64 and 32 px (256/8 = 32, every edge a multiple of 8). A 20/21
  pitch does not - at 32 px the tooth edges fall on 4.50, 9.63, 12.13, 14.75, 17.25,
  19.88, 22.38, 25.00, so some teeth get two solid pixels and others get one solid
  pixel between two grey halves. The teeth stop matching each other. With five equal
  teeth and tooth = gap, "flush" and "184 px wide" and "crisp at 32" cannot all hold:
  the tooth width has to be a multiple of 16 for the centre tooth to stay on grid,
  and 5 x 16 + 4 x 16 = 144, not 184. Pick two. This file picks flush + width.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <path
     fill="#1F5885"
     d="M 256 128 C 256 177.85 257.11 214.16 235.63 235.63 C 214.16 257.11 177.85 256 128 256 C 78.15 256 41.84 257.11 20.37 235.63 C -1.11 214.16 0 177.85 0 128 C 0 78.15 -1.11 41.84 20.37 20.37 C 41.84 -1.11 78.15 0 128 0 C 177.85 0 214.16 -1.11 235.63 20.37 C 257.11 41.84 256 78.15 256 128 Z" />
  <path
     fill="#F2F0E3"
     d="M 44 58 H 212 A 8 8 0 0 1 220 66 V 198
        H 200 V 108
        H 179 V 198 H 159 V 108
        H 138 V 198 H 118 V 108
        H 97  V 198 H 77  V 108
        H 56  V 198 H 36  V 66 A 8 8 0 0 1 44 58 Z" />
</svg>
