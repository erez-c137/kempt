<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kempt - full-colour application icon, SOFT-FLUSH variant (decision candidate).
  Between kempt.svg (20 px spine overhang each side) and kempt-flush.svg (none):
  4 px of spine past the last tooth, the hair of back a real comb actually has.

  Teeth are byte-identical to kempt.svg and kempt-flush.svg - same count, width,
  gaps and x positions. Only the spine width changes: 184 -> 152 -> 144 px across
  the three candidates, i.e. 20 px / 4 px / 0 px of overhang per side.

  Comb   152 x 140 = 59.4% x 54.7% of the 256 tile, centred (x 52-204, y 58-198).
         Spine  50 px = 36%   y 58-108, width 152, top corners r=8.
         Teeth  90 px = 64%   y 108-198, square tips.
         5 teeth, 16 px wide, 16 px gaps (tooth = gap), 4 px overhang each end.
         Tooth spans x: 56-72, 88-104, 120-136, 152-168, 184-200.

  Scale of the overhang: 4 px of a 256 tile is 2 px at 128, 1 px at 64, half a
  pixel at 32 and a quarter at 16 - visible as a deliberate detail where the icon
  is big, and dissolving into the tooth at panel sizes. That is the intent.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <path
     fill="#1F5885"
     d="M 256 128 C 256 177.85 257.11 214.16 235.63 235.63 C 214.16 257.11 177.85 256 128 256 C 78.15 256 41.84 257.11 20.37 235.63 C -1.11 214.16 0 177.85 0 128 C 0 78.15 -1.11 41.84 20.37 20.37 C 41.84 -1.11 78.15 0 128 0 C 177.85 0 214.16 -1.11 235.63 20.37 C 257.11 41.84 256 78.15 256 128 Z" />
  <path
     fill="#F2F0E3"
     d="M 60 58 H 196 A 8 8 0 0 1 204 66 V 108
        H 200 V 198 H 184 V 108
        H 168 V 198 H 152 V 108
        H 136 V 198 H 120 V 108
        H 104 V 198 H 88  V 108
        H 72  V 198 H 56  V 108
        H 52 V 66 A 8 8 0 0 1 60 58 Z" />
</svg>
