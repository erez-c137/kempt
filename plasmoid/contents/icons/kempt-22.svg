<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kempt - full-colour application icon, 22 px rung of the hicolor size ladder.
  A separate HAND-HINTED drawing on the 22 px pixel grid, never a scaled copy of the 16 px
  one: the viewBox IS 22 units, so every edge below is a whole device pixel at the served
  size. Two flat colours only: slate #1F5885 tile, cream #F2F0E3 comb.

  Comb geometry taken from kempt-symbolic.svg (the 22 px panel glyph), which already proved
  this grid at this size. Two changes, both because a tile is not a panel:

  Comb   14 w x 14 h, CENTRED (x 4-18, y 4-18)
  Spine  y 4-9   (5 px)
  Teeth  y 9-18  (9 px), 2 px wide, 1 px gaps, square tips, FLUSH with the spine ends
         x: 4-6, 7-9, 10-12, 13-15, 16-18
  5 teeth at 2 px + 4 gaps at 1 px = 14 px exactly. The tooth/gap grid is the symbolic
  glyph's, untouched.

  What changed from the symbolic glyph, and why:
  - It sits CENTRED. The symbolic glyph is pushed up and left (x 2-16, y 3-16) to keep the
    plasmoid's opaque count badge off the comb. This file is an application icon on a tile:
    nothing draws a badge over it, and an off-centre comb inside a symmetric squircle is
    visible. Centring 14 units in 22 gives 4 px of margin on all four sides.
  - The teeth are 9 px rather than 8. A 13 px comb cannot centre on an integer in a 22 px
    box ((22-13)/2 = 4.5, which would put every horizontal edge on a half pixel). 14 does.
    The extra pixel went to the teeth rather than the spine, which lands the spine-to-teeth
    split on 5:9 = 35.7/64.3 - closer to the 37.5/62.5 the rest of the ladder holds than the
    glyph's own 5:8.

  No end taper and no rounded tips: at 2 px per tooth there is nothing to cut into or round
  off. Flush ends and square tips, exactly as kempt-32.svg and kempt-16.svg do.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <path
     fill="#1F5885"
     d="M 22 11 C 22 15.28398 22.09539 18.40437 20.24945 20.24945 C 18.40437 22.09539 15.28398 22 11 22 C 6.71602 22 3.59563 22.09539 1.75055 20.24945 C -0.09539 18.40437 0 15.28398 0 11 C 0 6.71602 -0.09539 3.59563 1.75055 1.75055 C 3.59563 -0.09539 6.71602 0 11 0 C 15.28398 0 18.40437 -0.09539 20.24945 1.75055 C 22.09539 3.59563 22 6.71602 22 11 Z" />
  <path
     fill="#F2F0E3"
     d="M4 4 H18 V18 H16 V9 H15 V18 H13 V9 H12 V18 H10 V9 H9 V18 H7 V9 H6 V18 H4 Z" />
</svg>
