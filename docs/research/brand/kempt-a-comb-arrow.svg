<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Kempt concept A (v2): "combed down" - a comb whose tooth-tips trace a downward arrow.
       Brand shape (comb = kempt) and category shape (down arrow = updates) in one form.
       v1 used a 4px V-drop and read as an uneven comb; this is a 6px drop. -->
  <g fill="currentColor">
    <rect x="1" y="2" width="14" height="2"/>
    <rect x="1"  y="4" width="2" height="3"/>
    <rect x="4"  y="4" width="2" height="6"/>
    <rect x="7"  y="4" width="2" height="9"/>
    <rect x="10" y="4" width="2" height="6"/>
    <rect x="13" y="4" width="2" height="3"/>
  </g>
</svg>
