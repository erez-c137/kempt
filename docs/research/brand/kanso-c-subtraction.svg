<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Kanso concept C: many reduced to one. Three rows shortening to a single mark:
       "simplicity through omission" read as subtraction rather than as a ring. -->
  <g fill="currentColor">
    <rect x="2" y="2"  width="12" height="2"/>
    <rect x="2" y="7"  width="8"  height="2"/>
    <rect x="2" y="12" width="3"  height="2"/>
  </g>
</svg>
