# The offline lifecycle against REAL dnf5, once a week and on demand.
#
# The test suite stubs dnf5 and flatpak on purpose, so it cannot notice when dnf5 itself changes:
# a renamed key in the offline transaction state file, a different status word, a new shape for
# the stored transaction. tests/live/offline-gate.sh stages, arms, holds, rebuilds and breaks a
# real offline transaction as root, so running it on a schedule is what turns a dnf5 update into a
# red badge here instead of a wrong popup on someone's machine.
#
# Not on every push: it downloads real updates and takes several minutes, and what it guards
# against changes when Fedora ships dnf5, not when this repository changes. Run it by hand
# (workflow_dispatch) before a release that touches the offline path.
name: live offline gate

on:
  schedule:
    # Mondays 05:17 UTC. Off the hour, so it does not queue behind everyone else's midnight job.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: offline lifecycle on real dnf5
    runs-on: ubuntu-latest
    # The gate renames /usr/bin/dnf5, empties dnf5's package cache and points repositories at a
    # dead address to inject failures, so it refuses to run outside a throwaway container. The root
    # helpers start dnf5 only through systemd-run, which needs systemd as PID 1, and a job container
    # cannot give that. tests/live/run-offline-gate.sh boots one with podman (preinstalled on
    # ubuntu-latest), the same way it does on a workstation.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Run the gate in a systemd container
        run: bash tests/live/run-offline-gate.sh
