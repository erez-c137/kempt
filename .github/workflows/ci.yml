# Live since the public flip (2026-09-03): Actions are free on a public repo, so every push to
# main and every pull request runs the suite and the lint. While the repo was private this was
# workflow_dispatch-only against a $0 Actions budget; that guard is not needed anymore.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # apt, not a third-party action: one less supply-chain edge for a repo whose whole point is
      # a privileged helper, and ubuntu-latest already carries a recent enough shellcheck.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      # Green on every push since the public flip. Before that, with shellcheck not installed on the
      # dev box, this exact command was run in a throwaway podman container against the
      # koalaman/shellcheck images for v0.9.0, v0.10.0 and stable (0.11.0): all three exit 0.
      # Three versions rather than one because the runner's apt shellcheck is whatever
      # ubuntu-latest happens to carry that month, and the versions disagree - 0.9.0 and 0.10.0
      # report an SC2015 on lib/common.sh that 0.11.0 does not. Every finding either got a real
      # fix or a one-line `disable` naming the constraint; there are no file-level suppressions.
      #
      # -x follows `source`. bin/kempt sources through a runtime-computed $ROOT, which shellcheck
      # cannot resolve, so --source-path points it at the two directories those files really live
      # in. Anything still unresolved comes back as SC1091 and is informational.
      - name: Lint
        run: |
          shellcheck -x -s bash \
            --source-path="$GITHUB_WORKSPACE" \
            --source-path="$GITHUB_WORKSPACE/lib" \
            --source-path="$GITHUB_WORKSPACE/backends" \
            bin/kempt lib/common.sh backends/*.sh libexec/kempt-refresh libexec/kempt-apply tools/*.sh

  # The whole suite, once, on the platform Kempt ships to. It used to run three times: here on
  # Ubuntu without the widget's tools, in the package build's check stage without node, PySide6 or
  # any locale, and in part in a widget job. Each copy skipped something the others covered.
  # This one has everything the suite can use, and fails if the widget or locale halves skip.
  suite:
    name: test suite (Fedora, widget included)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44
    steps:
      # Before the checkout: without git 2.18 or later on PATH, actions/checkout downloads a
      # tarball instead of cloning. git is also what test_version.sh needs for its hand-build
      # names. plasma-workspace is the heavy one and it is not optional: probe_state.py imports
      # org.kde.plasma.plasmoid, which is where that module lives. The three language packs are
      # the locales test_summary.sh sorts and prints under; util-linux brings su and setpriv.
      - name: Install what the suite can use
        run: |
          dnf5 -y -q install git-core jq util-linux diffutils python3 gettext rpmdevtools /usr/bin/xmllint \
            nodejs python3-pyside6 kf6-kirigami plasma-workspace \
            glibc-langpack-en glibc-langpack-he glibc-langpack-tr
          node --version
          python3 -c 'import PySide6; print("PySide6", PySide6.__version__)'

      - uses: actions/checkout@v7

      - name: Check the container has what the suite needs
        run: |
          for t in bash jq flock date sort join comm paste awk sed grep cmp find python3 node git su; do
            command -v "$t" >/dev/null || { echo "missing prerequisite: $t" >&2; exit 1; }
          done
          bash --version | head -1
          locale -a | grep -i '^en_US.utf-\?8$'

      # Same command CONTRIBUTING.md asks for before a commit.
      - name: Syntax check
        run: |
          bash -n bin/kempt lib/common.sh backends/*.sh libexec/kempt-refresh libexec/kempt-apply
          python3 -c 'import sys; compile(open(sys.argv[1]).read(), sys.argv[1], "exec")' libexec/kempt-flatpak-unused

      # As an ordinary user, from a copy that user owns. A container runs steps as root, and as
      # root test_helpers.sh skips whole and the cases about what an unprivileged caller cannot do
      # skip too. Two files at a time: a CI run is one heavy job on a shared machine.
      #
      # run_tests.sh fails on any failing file. The test files SKIP rather than fail when node,
      # PySide6 or a locale is missing, which is right on a contributor's laptop and wrong here, so
      # those skips fail the job by name. Not every skip: test_widget_logic.sh also skips a case
      # that needs another Plasma tray applet installed, and a container legitimately has none.
      - name: Run the suite
        shell: bash
        run: |
          useradd -m tester
          cp -a "$GITHUB_WORKSPACE" /home/tester/kempt
          chown -R tester: /home/tester/kempt
          su - tester -c 'cd ~/kempt && KEMPT_TEST_JOBS=2 tests/run_tests.sh' 2>&1 | tee /tmp/suite.log
          deps='node is (not installed|absent)|no node here|PySide6 is absent'
          deps+='|premise - en_US.UTF-8 is not installed|python3 not installed'
          if grep -E "^skip: ($deps)" /tmp/suite.log; then
            echo "::error::a dependency this job installs was missing, so the suite skipped what it exists to run"
            exit 1
          fi

  # The three files with cases that need only an unprivileged user namespace. On the last runs
  # the Ubuntu host gave one and the Fedora container (as a non-root user) did not: the package
  # build's check stage logged "no unprivileged user namespaces". Until the job above shows those
  # cases running, they run here too. Remove this job once the suite job's skip list no longer
  # names a user namespace. Cases that need a second user inside the namespace (all of
  # test_helpers.sh's, some of test_doctor.sh's) skip on both runners: neither has subordinate ids.
  userns:
    name: user-namespace cases (Ubuntu host)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: The files that need a user namespace
        shell: bash
        run: |
          rc=0
          for f in test_doctor.sh test_doctor_folders.sh test_version.sh; do
            echo "== $f"
            bash "tests/$f" 2>&1 | tee -a /tmp/ns.log || rc=1
          done
          if grep -E '^skip: no (unprivileged )?user namespace' /tmp/ns.log; then
            echo "::error::no user namespace on this runner, so this job did not run what it exists to run"
            exit 1
          fi
          exit "$rc"

  # The package, built the way Fedora builds it, without its check stage: the job above already ran
  # the suite. The check stage still runs in the release check (tests/release/release-check.sh) and
  # in the COPR build, so a test that quietly needs something the spec does not declare is still
  # caught before a release, but no longer on every push.
  package:
    name: RPM build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v7

      # rpmspec reads the build requirements out of the spec itself, so this list cannot drift from
      # what the spec declares.
      - name: Build tools and the spec's own build requirements
        shell: bash
        run: |
          set -euo pipefail
          dnf5 -y -q install rpm-build rpmdevtools rpmlint createrepo_c
          mapfile -t buildrequires < <(rpmspec -q --buildrequires kempt.spec)
          dnf5 -y -q install "${buildrequires[@]}"

      # Laid out exactly like the release archive GitHub serves for a tag: one top directory named
      # kempt-VERSION. There is no .gitattributes, so nothing in the tree is left out of that
      # archive and nothing is left out of this one.
      - name: The source tarball, laid out like the release archive
        shell: bash
        run: |
          set -euo pipefail
          v="$(head -1 VERSION)"
          useradd -m builder
          su - builder -c rpmdev-setuptree
          tar --exclude=./.git --transform "s,^\.,kempt-$v," \
            -czf "/home/builder/rpmbuild/SOURCES/kempt-$v.tar.gz" .
          cp kempt.spec /home/builder/rpmbuild/SPECS/
          chown -R builder: /home/builder/rpmbuild

      - name: Build
        run: su - builder -c 'rpmbuild -ba --nocheck ~/rpmbuild/SPECS/kempt.spec'
      # Warnings are expected and described in docs/RELEASING.md; an error is not.
      - name: rpmlint reports no errors
        shell: bash
        run: |
          set -uo pipefail
          out="$(rpmlint /home/builder/rpmbuild/SRPMS/*.src.rpm /home/builder/rpmbuild/RPMS/noarch/*.rpm 2>&1)"
          echo "$out"
          grep -qE ' 0 errors, ' <<<"$out" || { echo "::error::rpmlint reported errors"; exit 1; }

      # The command the README gives, against the packages just built.
      - name: Install the widget package the way a user would
        shell: bash
        run: |
          set -euo pipefail
          v="$(head -1 VERSION)"
          mkdir -p /localrepo
          cp /home/builder/rpmbuild/RPMS/noarch/*.rpm /localrepo/
          createrepo_c -q /localrepo
          printf '[local]\nname=local\nbaseurl=file:///localrepo\nenabled=1\ngpgcheck=0\n' > /etc/yum.repos.d/local.repo
          dnf5 -y install kempt-plasmoid
          test "$(rpm -q --qf '%{VERSION}' kempt)" = "$v"
          test "$(rpm -q --qf '%{VERSION}' kempt-plasmoid)" = "$v"
          test "$(kempt --version)" = "kempt $v"
          # The build must leave the root helpers' privileged-mode shebang exactly as written.
          test "$(head -1 /usr/libexec/kempt-apply)" = '#!/usr/bin/bash -p'
          test "$(head -1 /usr/libexec/kempt-refresh)" = '#!/usr/bin/bash -p'
