# Live since the public flip (2026-09-03): Actions are free on a public repo, so every push to
# main and every pull request runs the suite and the lint. While the repo was private this was
# workflow_dispatch-only against a $0 Actions budget; that guard is not needed anymore.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # apt, not a third-party action: one less supply-chain edge for a repo whose whole point is
      # a privileged helper, and ubuntu-latest already carries a recent enough shellcheck.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      # TRIAGED AND CLEAN, but never yet run here. shellcheck is not installed on the dev box, so
      # this exact command was executed instead in a throwaway podman container against the
      # koalaman/shellcheck images for v0.9.0, v0.10.0 and stable (0.11.0): all three exit 0.
      # Three versions rather than one because the runner's apt shellcheck is whatever
      # ubuntu-latest happens to carry that month, and the versions disagree - 0.9.0 and 0.10.0
      # report an SC2015 on lib/common.sh that 0.11.0 does not. Every finding either got a real
      # fix or a one-line `disable` naming the constraint; there are no file-level suppressions.
      #
      # -x follows `source`. bin/kempt sources through a runtime-computed $ROOT, which shellcheck
      # cannot resolve, so --source-path points it at the two directories those files really live
      # in. Anything still unresolved comes back as SC1091 and is informational.
      - name: Lint
        run: |
          shellcheck -x -s bash \
            --source-path="$GITHUB_WORKSPACE" \
            --source-path="$GITHUB_WORKSPACE/lib" \
            --source-path="$GITHUB_WORKSPACE/backends" \
            bin/kempt lib/common.sh backends/*.sh libexec/* install.sh

  tests:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The suite needs bash 4+, jq, util-linux flock and GNU coreutils, and nothing else: every
      # impure command reaches the system through an environment seam that tests/lib.sh stubs, so
      # dnf5, flatpak, rpm, pkexec and notify-send are never invoked and need not exist. Verified
      # on the dev box by running the whole suite under a stripped PATH containing only
      # bash/jq/flock/coreutils/sed/gawk/grep/findutils (diffutils only for the tests' own file
      # comparisons; the shipped code compares with coreutils alone), with dnf, dnf5, flatpak, rpm,
      # pkexec, notify-send, systemctl, apt, python3 and perl all unreachable: ALL PASS.
      - name: Check the runner has what the suite needs
        run: |
          for t in bash jq flock date sort join comm paste awk sed grep cmp find; do
            command -v "$t" >/dev/null || { echo "missing prerequisite: $t" >&2; exit 1; }
          done
          bash --version | head -1
          jq --version

      # A konsole shim used to live here for tests/test_run.sh. The tests stub their own
      # terminal now (test_run.sh and test_log.sh both export KEMPT_TERMINAL at a fake), so
      # this job runs the suite with no terminal emulator at all - same as the RPM check
      # stage does in a mock buildroot, where the shimless suite was first proven.

      # Same command CONTRIBUTING.md asks for before a commit.
      - name: Syntax check
        run: bash -n bin/kempt lib/common.sh backends/*.sh libexec/* install.sh

      # run_tests.sh exits non-zero on any failing file, and fails outright if it matches no test
      # files at all, so a suite that silently stopped existing cannot pass as green.
      - name: Run the suite
        run: tests/run_tests.sh

  # The widget's own halves, which the job above CANNOT run: logic.js needs node, and the QML
  # probes need PySide6 plus the Plasma and Kirigami QML modules the widget imports. Neither was
  # installed on the runner, so both skipped - and a skip printed with the same "ok:" prefix as a
  # pass. Every green badge on this repo until now covered the CLI and nothing of the panel, while
  # CONTRIBUTING.md told contributors those two files carry more than half the suite's assertions.
  #
  # In a Fedora container because that is where the Plasma QML modules are a dnf install away, and
  # because it is the platform Kempt ships to. Verified against fedora:44: all eight probes green,
  # nothing left resident.
  widget:
    name: widget (node + QML)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v7

      # plasma-workspace is the heavy one and it is not optional: probe_state.py imports
      # org.kde.plasma.plasmoid, which is where that module lives.
      - name: Install the widget's test dependencies
        run: |
          dnf -y install jq util-linux-core nodejs python3-pyside6 kf6-kirigami plasma-workspace
          node --version
          python3 -c 'import PySide6; print("PySide6", PySide6.__version__)'

      # Both files SKIP loudly rather than fail when a dependency is missing, which is right for a
      # contributor's laptop and wrong here: this job exists to run them. So the run is checked for
      # a skip line and fails on one, or the job would go green having done nothing at all.
      # `bash <file>`, never `./<file>`: the test files are mode 0644 by house convention and
      # run_tests.sh invokes them the same way.
      - name: The derivation layer (logic.js under node) and the .qml compile check
        shell: bash
        run: |
          set -o pipefail   # without it `tee` hands back its own status and a failing suite goes green
          bash tests/test_widget_logic.sh 2>&1 | tee /tmp/logic.log
          grep -q '^skip:' /tmp/logic.log && { echo "::error::a dependency was missing, so this job skipped what it exists to run"; exit 1; } || true

      - name: The QML probes, against the real Qt 6 engine
        shell: bash
        run: |
          set -o pipefail
          bash tests/test_widget_qml.sh 2>&1 | tee /tmp/qml.log
          grep -q '^skip:' /tmp/qml.log && { echo "::error::a dependency was missing, so this job skipped what it exists to run"; exit 1; } || true
