name: Bug report
description: Something Kempt did wrong, or failed to do
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The output below answers most follow-up questions.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what Kempt did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: kempt doctor output
      description: Paste the full output of `kempt doctor`. It shows the version and how Kempt is installed. If the `kempt` command is not installed, say so here.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install-path
    attributes:
      label: How is Kempt installed?
      options:
        - COPR package (dnf install kempt)
        - KDE Store / Get New Widgets (widget only)
        - Git checkout (install.sh)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant kempt log lines
      description: Optional. If the problem is with a check or an update, `kempt log` shows what Kempt did.
      render: text
