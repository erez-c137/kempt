name: Feature request
description: Something Kempt should do, or do differently
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what makes it hard with Kempt today. A clear problem matters more than a proposed fix.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Optional. What you would like Kempt to do.
  - type: dropdown
    id: surface
    attributes:
      label: Which part?
      options:
        - The command line
        - The Plasma widget
        - Both
        - Not sure
